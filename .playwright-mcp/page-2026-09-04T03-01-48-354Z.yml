          - heading "Quy trình sấy gọn và an toàn" [level=3] [ref=f11e172]
          - list [ref=f11e173]:
            - listitem [ref=f11e174]: Vắt kỹ quần áo và kiểm tra nhãn chăm sóc vải.
            - listitem [ref=f11e175]: Treo đồ có khoảng cách, không che khu vực thổi khí.
            - listitem [ref=f11e176]: Kéo kín vỏ tủ, cắm điện vào ổ riêng chắc chắn và chọn thời gian.
            - listitem [ref=f11e177]: Để máy hoàn tất, rút điện và chờ nguội trước khi gấp cất.
          - heading "Câu hỏi thường gặp" [level=3] [ref=f11e178]
          - paragraph [ref=f11e179]:
            - strong [ref=f11e180]: Có nên sấy đủ 20kg mỗi lần không?
            - text: 20kg là tải tối đa công bố. Để khí lưu thông tốt và đồ khô đều, nên giảm lượng nếu quần áo dày hoặc khoang bị treo quá kín.
          - paragraph [ref=f11e181]:
            - strong [ref=f11e182]: Tủ có làm quần áo hết nhăn không?
            - text: Việc treo thẳng khi sấy có thể giảm một phần nếp gấp, nhưng không thay thế chức năng của bàn ủi hoặc máy hấp là quần áo.
          - paragraph [ref=f11e183]:
            - strong [ref=f11e184]: Có thể để máy chạy khi ra khỏi nhà không?
            - text: Không nên để thiết bị gia nhiệt hoạt động mà không có người kiểm soát. Luôn giữ khu vực xung quanh thông thoáng và làm theo hướng dẫn an toàn.
          - paragraph [ref=f11e185]:
            - strong [ref=f11e186]: GUME GM-8222
            - text: giúp gia đình bớt phụ thuộc vào nắng mà vẫn giữ được cách treo sấy quen thuộc. Dolphin House có thể hỗ trợ bạn kiểm tra diện tích đặt tủ, tải đồ thường dùng và cách bố trí ổ điện trước khi lựa chọn.
