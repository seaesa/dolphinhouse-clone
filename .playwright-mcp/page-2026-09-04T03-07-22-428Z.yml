          - heading "Chăm Sóc Thố Gốm Sứ Bear Sau Mỗi Lần Hầm" [level=2] [ref=f19e180]
          - paragraph [ref=f19e181]:
            - strong [ref=f19e182]: Thố gốm sứ và nắp kính
            - text: là hai bộ phận tháo rời để vệ sinh riêng. Rửa bằng nước rửa bát thông thường, có thể rửa trong máy rửa chén.
            - strong [ref=f19e183]: Thân nồi ngoài (đế điện)
            - text: không được nhúng vào nước — lau bằng khăn ẩm sau khi nguội hoàn toàn.
          - list [ref=f19e184]:
            - listitem [ref=f19e185]: Chờ thố sứ nguội hẳn trước khi cho vào tủ lạnh — tránh nứt gốm do sốc nhiệt
            - listitem [ref=f19e186]: Không nấu khi thố sứ trống, không có nước hoặc thực phẩm bên trong
            - listitem [ref=f19e187]: Đặt nồi trên bề mặt phẳng, khô ráo, tránh xa vật dễ cháy
          - heading "Câu Hỏi Thường Gặp" [level=2] [ref=f19e188]
          - paragraph [ref=f19e189]:
            - strong [ref=f19e190]: "Q: Nồi Bear DDG-D20N5 có thể dùng chưng yến cho trẻ nhỏ không?"
          - paragraph [ref=f19e191]: "A: Có thể dùng để chưng yến khi lựa chọn thời gian và lượng nước phù hợp theo hướng dẫn sử dụng. Công nghệ nấu cách thủy ở nhiệt độ thấp ổn định giúp bảo toàn các hoạt chất quý trong yến sào tốt hơn chưng cách thủy trực tiếp trên bếp. Dung tích 2.0L đủ để chưng 2–3 chén yến cùng lúc."
          - paragraph [ref=f19e192]:
            - strong [ref=f19e193]: "Q: Thức ăn nấu xong có bị nguội nhanh không nếu tôi chưa ăn ngay?"
          - paragraph [ref=f19e194]:
            - text: "A: Không. Nồi tự động chuyển sang chế độ"
            - strong [ref=f19e195]: giữ ấm
            - text: sau khi hoàn tất chu trình nấu — chế độ giữ ấm giúp món ăn duy trì độ ấm; không nên để thực phẩm trong nồi quá lâu và cần tuân thủ nguyên tắc bảo quản thực phẩm.
          - paragraph [ref=f19e196]:
            - strong [ref=f19e197]: "Q: Dùng điện bao nhiêu? Để cả đêm hầm xương có tốn kém không?"
          - paragraph [ref=f19e198]:
            - text: "A: Với công suất 175W — tương đương một bóng đèn công suất cao — mức tiêu thụ điện có thể ước tính từ công suất và thời gian sử dụng. Hầm 8 tiếng liên tục tiêu thụ khoảng 1.4 kWh, tương đương"
            - strong [ref=f19e199]: 3.500–4.000 đồng
            - text: tiền điện. Kinh tế và an toàn để chạy qua đêm.
          - paragraph [ref=f19e200]:
            - strong [ref=f19e201]: Cần tư vấn cách chọn dung tích hoặc chế độ nấu phù hợp?
            - text: Hãy liên hệ Dolphin House để được kiểm tra thông tin sản phẩm trước khi đặt hàng.
