      - generic [ref=f19e111]:
        - generic [ref=f19e112]: MÔ TẢ SẢN PHẨM
        - generic [ref=f19e113]:
          - paragraph [ref=f19e114]: Mỗi buổi sáng chuẩn bị bình yến cho con đi học, hay nồi cháo hầm xương đêm khuya cho bố mẹ về muộn — đó không phải chuyện nhỏ. Với bếp gas hay nồi thường, bạn phải canh chừng liên tục để tránh cạn nước, khê đáy hoặc mất đi phần tinh chất đã bỏ ra vài giờ nấu. Nồi hầm dưỡng sinh Bear DDG-D20N5 ra đời để giải phóng bạn khỏi việc đứng bếp — đặt vào, chọn chế độ, và để nồi làm việc thay bạn.
          - figure "Nồi Bear DDG-D20N5 — người bạn đồng hành của những bữa ăn dưỡng sinh gia đình" [ref=f19e115]:
            - img "Nồi hầm dưỡng sinh Bear DDG-D20N5 2.0L lòng gốm sứ – bát cháo và yến sào trên bếp gia đình ấm áp" [ref=f19e116]
          - heading "🏺 Lòng Nồi Gốm Sứ — Chất Liệu Gốm Sứ Dễ Chăm Sóc Trong Quá Trình Nấu Chậm" [level=2] [ref=f19e118]
          - paragraph [ref=f19e119]:
            - text: Điểm khác biệt của dòng “dưỡng sinh” Bear nằm ở lòng nồi làm từ
            - strong [ref=f19e120]: gốm sứ cao cấp chịu nhiệt
            - text: ", không sử dụng lớp phủ chống dính như một số loại lòng nồi kim loại. Khi sử dụng, nên tuân thủ hướng dẫn của nhà sản xuất và tránh thay đổi nhiệt độ đột ngột để bảo vệ thố."
          - paragraph [ref=f19e121]: So với lòng nồi nhôm phủ teflon, gốm sứ giữ nhiệt đều hơn và không có nguy cơ bong tróc lớp phủ — đặc biệt quan trọng khi bạn nấu các món hầm lâu như xương ống, chân giò hay yến sào cho trẻ nhỏ và người lớn tuổi.
          - heading "Nguyên Lý Nấu Cách Thủy — Giữ Dưỡng Chất Tốt Hơn Hẳn Bếp Gas" [level=2] [ref=f19e122]
          - paragraph [ref=f19e123]:
            - text: DDG-D20N5 hoạt động theo nguyên lý
            - strong [ref=f19e124]: nấu cách thủy
            - text: ": thân nồi ngoài truyền nhiệt đều qua thố sứ bên trong, giữ nhiệt độ ổn định trong dải 70–100°C. Ở nhiệt độ này, protein trong thịt và xương phân giải từ từ thành các acid amin dễ hấp thu; collagen chuyển hóa thành gelatin; vitamin tan trong nước (B, C) không bị phá hủy do sốc nhiệt như khi nấu bếp gas lửa lớn."
          - paragraph [ref=f19e125]: Nấu chậm giúp món hầm chín từ từ; mức độ lưu giữ dưỡng chất còn phụ thuộc nguyên liệu, nhiệt độ và thời gian thực tế.
          - heading "🍲 5 Chế Độ Nấu Thực Tế Cho Mọi Món Trong Tuần" [level=2] [ref=f19e126]
          - paragraph [ref=f19e127]: "Với dung tích 2.0L, DDG-D20N5 phù hợp cho gia đình 2–4 người:"
          - list [ref=f19e128]:
            - listitem [ref=f19e129]:
              - strong [ref=f19e130]: "Hầm xương:"
              - text: Xương ống heo, bò hầm 4–6 tiếng — nước dùng trong, ngọt sâu, không cần canh lửa
            - listitem [ref=f19e131]:
              - strong [ref=f19e132]: "Nấu cháo:"
              - text: Cháo trắng, cháo thịt bằm, cháo bào ngư — mềm mịn, không vón cục
            - listitem [ref=f19e133]:
              - strong [ref=f19e134]: "Chưng yến sào:"
              - text: Yến nguyên tổ hoặc yến sợi ở nhiệt độ thấp, giữ nguyên hoạt chất quý
            - listitem [ref=f19e135]:
              - strong [ref=f19e136]: "Nấu canh / súp:"
              - text: Súp bí đỏ, canh rau củ — nấu chậm ra vị ngọt tự nhiên không cần bột ngọt
            - listitem [ref=f19e137]:
              - strong [ref=f19e138]: "Nấu chè:"
              - text: Chè đậu xanh, chè hạt sen nhãn nhục — không sợi cháy đáy
          - heading "Thông Số Kỹ Thuật" [level=2] [ref=f19e139]
          - figure [ref=f19e140]:
            - table [ref=f19e141]:
              - rowgroup [ref=f19e142]:
