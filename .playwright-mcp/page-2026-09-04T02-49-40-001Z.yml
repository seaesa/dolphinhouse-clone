          - generic [ref=f4e208]:
            - generic [ref=f4e209]: Mô tả sản phẩm
            - generic [ref=f4e211]:
              - paragraph [ref=f4e212]:
                - text: Mùa nồm, một cơn mưa kéo dài hay căn hộ ít nắng đều có thể khiến giá phơi đầy quần áo ẩm từ sáng đến tối.
                - strong [ref=f4e213]: Tủ sấy quần áo GUME GM-8222
                - text: "giúp gia đình chủ động hơn trong những ngày như vậy: treo đồ vào khoang, kéo kín vỏ tủ, chọn thời gian và để luồng khí ấm hoàn tất phần còn lại."
              - paragraph [ref=f4e214]: Điểm dễ chịu nhất không chỉ là quần áo khô nhanh hơn, mà là cảm giác sáng hôm sau vẫn có đồng phục sạch cho con, áo sơ mi khô cho người đi làm và khăn tắm không còn ẩm lạnh khi chạm vào.
              - figure "GUME GM-8222 giúp gia đình chủ động sấy quần áo trong ngày mưa nồm." [ref=f4e215]:
                - img "Tủ sấy quần áo GUME GM-8222 trong phòng giặt ngày mưa" [ref=f4e217]
              - heading "Chủ động khi quần áo chưa kịp khô" [level=2] [ref=f4e219]
              - heading "Công suất 2000W và bộ gia nhiệt PTC Ceramic" [level=3] [ref=f4e220]
              - paragraph [ref=f4e221]: Bộ gia nhiệt PTC Ceramic tạo luồng khí nóng đưa vào khoang sấy, hỗ trợ làm bay hơi ẩm trên quần áo. Công suất 2000W phù hợp khi cần xử lý nhiều đồ sau một mẻ giặt, đặc biệt trong thời tiết độ ẩm cao khiến cách phơi tự nhiên mất nhiều thời gian.
              - paragraph [ref=f4e222]: Tốc độ khô thực tế phụ thuộc lượng đồ, độ dày vải, mức vắt của máy giặt và độ thoáng giữa các móc. Quần áo đã được vắt kỹ sẽ khô nhanh và tiết kiệm điện hơn đồ còn sũng nước.
              - heading "Tải sấy tối đa 20kg nhưng cần treo có khoảng cách" [level=3] [ref=f4e223]
              - paragraph [ref=f4e224]: Khung tủ được công bố chịu tải sấy tối đa 20kg. Đây là giới hạn tải, không có nghĩa nên nhồi kín khoang trong mỗi lần dùng. Khi quần áo chạm sát nhau, khí nóng khó lưu thông và thời gian sấy kéo dài.
              - paragraph [ref=f4e225]: Nên treo áo, quần thành từng lớp có khoảng cách; đồ dày như khăn tắm, quần jean hoặc áo khoác cần đặt gần vùng luồng gió nhưng không che cửa thổi. Đồ mỏng có thể lấy ra trước để tránh sấy lâu không cần thiết.
              - heading "Dễ đưa vào nếp sinh hoạt của gia đình" [level=2] [ref=f4e226]
              - heading "Hẹn giờ tối đa 4 giờ, điều khiển trực tiếp hoặc từ xa" [level=3] [ref=f4e227]
              - paragraph [ref=f4e228]: Người dùng có thể chọn thời gian sấy phù hợp bằng bảng điều khiển cảm ứng hoặc điều khiển từ xa. Mốc hẹn giờ tối đa 4 giờ giúp chủ động hơn khi sấy nhiều loại vải, nhưng nên kiểm tra nhãn chăm sóc trên quần áo trước khi chọn thời gian dài.
              - paragraph [ref=f4e229]: Một cách dùng thực tế là bắt đầu với thời gian ngắn cho đồ mỏng, kiểm tra độ khô rồi tăng thêm nếu cần. Cách này nhẹ nhàng với sợi vải hơn việc mặc định chạy lâu cho mọi mẻ.
              - heading "Khung gấp gọn và bánh xe dễ di chuyển" [level=3] [ref=f4e230]
              - paragraph [ref=f4e231]: Khi lắp hoàn chỉnh, tủ có kích thước khoảng 90 × 50 × 170cm, đủ cao để treo nhiều trang phục. Khung có thể gấp gọn và bánh xe hỗ trợ di chuyển khi không sử dụng, phù hợp căn hộ cần tận dụng linh hoạt khu vực ban công hoặc phòng giặt.
              - paragraph [ref=f4e232]: Vẫn nên chọn một vị trí bằng phẳng, khô và thoáng. Không đặt tủ trong phòng tắm ướt, sát rèm hoặc gần vật dễ cháy. Dây điện cần cắm trực tiếp vào ổ chắc chắn, tránh dùng chung ổ kéo dài với nhiều thiết bị công suất cao.
              - heading "GUME GM-8222 phù hợp với ai?" [level=2] [ref=f4e233]
              - paragraph [ref=f4e234]: Sản phẩm phù hợp với gia đình ở chung cư, nhà ít nắng, khu vực có mùa mưa nồm hoặc thường cần quần áo khô đúng giờ. Đây cũng là giải pháp bổ sung cho những món đồ không muốn quay mạnh trong máy sấy lồng.
              - paragraph [ref=f4e235]: Tủ sấy dùng khí nóng trong khoang vải, không tạo hiệu quả làm phẳng như bàn ủi và không nên được mô tả như thiết bị khử khuẩn chuyên dụng. Với vải nhạy nhiệt, len, lụa hoặc đồ có chi tiết dán, luôn kiểm tra nhãn hướng dẫn trước khi sấy.
