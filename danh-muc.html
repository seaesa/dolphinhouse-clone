<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Danh mục sản phẩm | Dolphin House</title>
<link rel="icon" href="assets/favicon/favicon-32x32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<main class="container">
  <nav class="breadcrumb"><a href="index.html">Trang chủ</a> / <a href="cua-hang.html">Cửa hàng</a> / <span id="crumb-current"></span></nav>
  <div class="page-head">
    <h1 id="listing-title">Danh mục sản phẩm</h1>
    <p class="desc" id="listing-desc"></p>
  </div>
  <div class="category-chip-row" id="category-chips"></div>
  <div class="shop-toolbar">
    <p id="result-count"></p>
    <select id="sort-select">
      <option value="default">Sắp xếp mặc định</option>
      <option value="latest">Sắp xếp theo mới nhất</option>
      <option value="price-asc">Sắp xếp theo giá: thấp đến cao</option>
      <option value="price-desc">Sắp xếp theo giá: cao đến thấp</option>
    </select>
  </div>
  <div class="product-grid" id="product-listing"></div>
  <nav class="pagination" id="pagination"></nav>
</main>

<div id="site-footer"></div>

<script src="js/data/products.data.js"></script>
<script src="js/data/categories.data.js"></script>
<script src="js/common.js"></script>
<script src="js/shop.js"></script>
<script>
  const slug = qs("slug");
  const cat = CATEGORIES.find((c) => c.slug === slug);
  document.getElementById("crumb-current").textContent = cat ? cat.name : "Danh mục";
  document.title = (cat ? cat.name : "Danh mục sản phẩm") + " | Dolphin House";
  bindSortHandler();
  renderListing({ categorySlug: slug });
</script>
</body>
</html>
